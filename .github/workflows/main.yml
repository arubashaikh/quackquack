name: Build QuackQuack EXE and MSI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get the game files
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pygame and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame pyinstaller

      - name: Create EXE
        run: |
          python -m PyInstaller --onefile --windowed --name QuackQuack quackquack.py

      - name: Install WiX Toolset
        shell: powershell
        run: choco install wixtoolset --version=3.14.1 -y --no-progress

      - name: Create MSI installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path installer\build | Out-Null
          candle.exe -dSourceDir="$pwd\dist" installer\Product.wxs -out installer\build\Product.wixobj
          light.exe -ext WixUIExtension -out dist\QuackQuack-Setup.msi installer\build\Product.wixobj

      - name: Save EXE and MSI
        uses: actions/upload-artifact@v4
        with:
          name: QuackQuack-Windows
          path: |
            dist/QuackQuack.exe
            dist/QuackQuack-Setup.msi
